<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Schräg abgeschnittenes Schilfrohr drückt Keile in feuchten Ton</title>
  <!-- Tontafel -->
  <rect x="30" y="330" width="560" height="200" rx="26" fill="#DCC093" stroke="#A8865A" stroke-width="4"/>
  <!-- Keilabdrücke: dreieckiger Kopf + schmaler Schwanz -->
  <g fill="#8C6B3F">
    <path d="M90 400 l70 -16 l0 32 z"/><path d="M160 400 l90 0" stroke="#8C6B3F" stroke-width="5"/>
    <path d="M90 470 l70 -16 l0 32 z"/><path d="M160 470 l90 0" stroke="#8C6B3F" stroke-width="5"/>
    <path d="M300 372 l-16 70 l32 0 z"/><path d="M300 442 l0 64" stroke="#8C6B3F" stroke-width="5"/>
    <path d="M370 372 l-16 70 l32 0 z"/><path d="M370 442 l0 64" stroke="#8C6B3F" stroke-width="5"/>
    <path d="M430 395 l58 34 l-26 26 z"/>
  </g>
  <!-- Schilfrohr -->
  <g transform="rotate(38 560 120)">
    <rect x="520" y="-120" width="44" height="330" fill="#C9B26B" stroke="#7D6A2F" stroke-width="4"/>
    <line x1="520" y1="30" x2="564" y2="30" stroke="#7D6A2F" stroke-width="3"/>
    <!-- schräg abgeschnittene Spitze -->
    <path d="M520 210 L564 210 L542 262 Z" fill="#B59C52" stroke="#7D6A2F" stroke-width="4"/>
  </g>
  <!-- Druckpfeil -->
  <path d="M455 300 l-28 40" stroke="#C61919" stroke-width="6" fill="none"/>
  <path d="M418 352 l2 -24 l20 10 z" fill="#C61919"/>
  <!-- Querschnitt der Spitze -->
  <g transform="translate(610 360)">
    <rect x="0" y="0" width="130" height="130" rx="14" fill="#fff" stroke="#039A9A" stroke-width="3"/>
    <path d="M30 98 L100 98 L65 32 Z" fill="#B59C52" stroke="#7D6A2F" stroke-width="4"/>
  </g>
  <text x="675" y="515" font-size="22" fill="#02736F" text-anchor="middle">Spitze von vorn</text>
  <!-- Beschriftungen -->
  <text x="30" y="40" font-size="30" font-weight="700" fill="#02736F">Schilfrohr, schräg abgeschnitten</text>
  <text x="30" y="78" font-size="25" fill="#5C5C5C">Ecke und Kante der Spitze werden</text>
  <text x="30" y="108" font-size="25" fill="#5C5C5C">in den weichen Ton gedrückt</text>
  <text x="30" y="318" font-size="25" fill="#5C5C5C">feuchter Ton</text>
  <text x="80" y="548" font-size="24" fill="#111">Abdruck = Keil: dreieckiger Kopf + schmaler Schwanz</text>
</svg>
